                // Pedagogy: Think & Link

                thinkQ: "情境題：你正在開發一個「音樂播放清單」應用程式。用戶經常會拖曳歌曲來改變播放順序（在中間頻繁進行插入與刪除）。理論上，哪種資料結構更適合用來管理播放順序？",
                thinkPlaceholder: "在核對答案前，請先在此寫下你的想法...",
                btnShowAns: "核對老師解析",
                btnHideAns: "隱藏解析",
                thinkExpert: "老師解析：",
                thinkA: "<strong>鏈結串列 (Linked List)</strong>。因為用戶頻繁在中間插入與刪除歌曲，鏈結串列只需更新指標即可在 $O(1)$ 時間內完成。若使用陣列 (Array)，每次移動歌曲都需要耗費 $O(n)$ 的時間來平移後續元素。",

                // Pedagogy: Quiz
                quizTitle: "自我檢測 (Self-Assessment)",
                quizQ1: "問：如果系統 RAM 遭遇嚴重的「記憶體碎片化 (Memory Fragmentation)」，哪一種資料結構最容易宣告失敗（無法分配空間）？",
                q1OptA: "陣列 (Array)",
                q1OptB: "鏈結串列 (Linked List)",
                quizFbCorrect: "✅ 答對了！陣列需要尋找一塊完整「連續」的記憶體。",
                quizFbWrong: "❌ 答錯了。請再試一次！思考一下哪種結構必須要「並排」空間。",

                // Simulator Controls
                actionTitle: "互動模擬器 (Simulator)",
                lblSize: "資料大小:",
                lblSizeHint: "(留空=隨機)",
                btnAllocArr: "分配陣列 (Array)",
                btnAllocLl: "分配鏈結串列 (Linked List)",
                btnFrag: "產生碎片化記憶體",
                btnClean: "清理記憶體",
                btnClearAlloc: "清除已分配區塊",
                ramTitle: "記憶體 (8x8 Grid)",
                legFree: "空閒",
                legOs: "已被系統佔用",

                // Toast Messages
                msgArrSuccess: "✅ 陣列 (大小 {size}) 分配成功！已找到連續記憶體。",
                msgArrFail: "❌ 陣列分配失敗！找不到足夠的「連續」空間。",
                msgLlSuccess: "✅ 鏈結串列 (大小 {size}) 分配成功！透過指標串連。",
                msgLlFail: "❌ 鏈結串列分配失敗！記憶體已完全耗盡。"
            }
        };

        const codeSnippets = {
            py: `
<span class="code-comment"># 1. Array (Python Lists act as dynamic arrays)</span>
arr = [<span class="code-str">10</span>, <span class="code-str">20</span>, <span class="code-str">30</span>, <span class="code-str">40</span>]
<span class="code-kw">print</span>(arr[<span class="code-str">2</span>]) <span class="code-comment"># O(1) Access -> Output: 30</span>

<span class="code-comment"># 2. Linked List Node Definition</span>
<span class="code-kw">class</span> <span class="code-type">Node</span>:
    <span class="code-kw">def</span> __init__(<span class="code-kw">self</span>, data):
        <span class="code-kw">self</span>.data = data
        <span class="code-kw">self</span>.next = <span class="code-kw">None</span> <span class="code-comment"># Pointer to next Node</span>

<span class="code-comment"># Creating a scattered Linked List manually</span>
head = Node(<span class="code-str">10</span>)
head.next = Node(<span class="code-str">20</span>)
head.next.next = Node(<span class="code-str">30</span>)`,
            cpp: `
<span class="code-comment">// 1. Array (Fixed contiguous memory block)</span>
<span class="code-type">int</span> arr[<span class="code-str">4</span>] = {<span class="code-str">10</span>, <span class="code-str">20</span>, <span class="code-str">30</span>, <span class="code-str">40</span>};
<span class="code-kw">cout</span> &lt;&lt; arr[<span class="code-str">2</span>]; <span class="code-comment">// O(1) Access -> Output: 30</span>

<span class="code-comment">// 2. Linked List Node Definition</span>
<span class="code-kw">struct</span> <span class="code-type">Node</span> {
    <span class="code-type">int</span> data;
    <span class="code-type">Node*</span> next; <span class="code-comment">// Pointer to next Node in memory</span>
};

<span class="code-comment">// Creating a scattered Linked List manually</span>
<span class="code-type">Node*</span> head = <span class="code-kw">new</span> Node{<span class="code-str">10</span>, <span class="code-kw">nullptr</span>};
head-&gt;next = <span class="code-kw">new</span> Node{<span class="code-str">20</span>, <span class="code-kw">nullptr</span>};
head-&gt;next-&gt;next = <span class="code-kw">new</span> Node{<span class="code-str">30</span>, <span class="code-kw">nullptr</span>};`
        };

        // --- Initialization ---
        function init() {
            initRAM(true); 
            updateLanguageUI();
            switchCode('py'); // Default to Python
            
            window.addEventListener('resize', () => {
                drawArrows();
            });
        }

        // --- Core RAM Logic ---
        function initRAM(fragmented) {
            ram = [];
            allocationCounter = 0;
            clearSVG();
            setStatus("", "");
            
            for (let i = 0; i < GRID_SIZE; i++) {
                ram.push({ id: i, type: 'empty', next: null, color: null, allocId: null });
            }

            if (fragmented) {
                let occupiedCount = 0;
                for (let i = 0; i < GRID_SIZE; i++) {
                    if (Math.random() > 0.55 || (i % 5 === 4)) {
                        ram[i].type = 'os';
                        occupiedCount++;
                    }
                }
                if ((GRID_SIZE - occupiedCount) < 15) {
                    initRAM(true); 
                    return;
                }
            }
            renderGrid();
        }

        function getRequestedSize() {
            const inputEl = document.getElementById('custom-size');
            let val = parseInt(inputEl.value);
            if (!isNaN(val) && val > 0) {
                return Math.min(val, GRID_SIZE);
            }
            return Math.floor(Math.random() * 4) + 3; // Random 3-6
        }

        function getColor() {
            return colors[allocationCounter % colors.length];
        }

        function allocateArray() {
            const size = getRequestedSize();
            let startIdx = -1;
            
            // Search for CONTIGUOUS blocks
            for (let i = 0; i <= GRID_SIZE - size; i++) {
                let canFit = true;
                for (let j = 0; j < size; j++) {
                    if (ram[i + j].type !== 'empty') {
                        canFit = false;
                        break;
                    }
                }
                if (canFit) {
                    startIdx = i;
                    break;
                }
            }

            const gridEl = document.getElementById('ram-grid');

            if (startIdx !== -1) {
                const colorObj = getColor();
                allocationCounter++;
                
                for (let j = 0; j < size; j++) {
                    ram[startIdx + j].type = 'array';
                    ram[startIdx + j].color = colorObj;
                    ram[startIdx + j].allocId = allocationCounter;
                }
                renderGrid();
                drawArrows(); 
                
                let msg = dict[currentLang].msgArrSuccess.replace('{size}', size);
                setStatus(msg, "text-blue-700 bg-blue-50 border-blue-200");
            } else {
                triggerShake(gridEl);
                let msg = dict[currentLang].msgArrFail;
                setStatus(msg, "text-red-700 bg-red-50 border-red-200");
            }
        }

        function allocateLinkedList() {
            const size = getRequestedSize();
            let allocatedNodes = [];
            
            // Search for SCATTERED blocks
            for (let i = 0; i < GRID_SIZE; i++) {
                if (ram[i].type === 'empty') {
                    allocatedNodes.push(i);
                    if (allocatedNodes.length === size) break;
                }
            }

            const gridEl = document.getElementById('ram-grid');

            if (allocatedNodes.length === size) {
                const colorObj = getColor();
                allocationCounter++;
                
                for (let k = 0; k < size; k++) {
                    let idx = allocatedNodes[k];
                    ram[idx].type = 'll';
                    ram[idx].color = colorObj;
                    ram[idx].allocId = allocationCounter;
                    
                    if (k < size - 1) {
                        ram[idx].next = allocatedNodes[k + 1];
                    }
                }
                renderGrid();
                drawArrows();
                
                let msg = dict[currentLang].msgLlSuccess.replace('{size}', size);
                setStatus(msg, "text-emerald-700 bg-emerald-50 border-emerald-200");
            } else {
                triggerShake(gridEl);
                let msg = dict[currentLang].msgLlFail;
                setStatus(msg, "text-red-700 bg-red-50 border-red-200");
            }
        }

        function clearAllocations() {
            clearSVG();
            allocationCounter = 0;
            for (let i = 0; i < GRID_SIZE; i++) {
                if (ram[i].type === 'array' || ram[i].type === 'll') {
                    ram[i].type = 'empty';
                    ram[i].next = null;
                    ram[i].color = null;
                    ram[i].allocId = null;
                }
            }
            renderGrid();
            setStatus("", "border-transparent");
        }

        // --- Rendering & Visuals ---
        function renderGrid() {
            const container = document.getElementById('ram-grid');
            container.innerHTML = '';
            
            ram.forEach((cell, index) => {
                const div = document.createElement('div');
                div.id = `cell-${index}`;
                div.className = `cell border rounded flex items-center justify-center text-[10px] font-extrabold w-full h-full shadow-sm`;
                
                if (cell.type === 'empty') {
                    div.classList.add('cell-empty');
                } else if (cell.type === 'os') {
                    div.classList.add('cell-os');
                } else if (cell.type === 'array') {
                    div.classList.add('cell-array');
                    div.style.backgroundColor = cell.color.bg;
                    div.style.borderColor = cell.color.border;
                    div.innerText = 'A';
                } else if (cell.type === 'll') {
                    div.classList.add('cell-ll');
                    div.style.backgroundColor = cell.color.bg;
                    div.style.borderColor = cell.color.border;
                    div.innerText = 'N';
                }
                
                container.appendChild(div);
            });
        }

        function drawArrows() {
            clearSVG();
            const svg = document.getElementById('svg-layer');
            const gridRect = document.getElementById('ram-grid').getBoundingClientRect();

            ram.forEach(cell => {
                if (cell.type === 'll' && cell.next !== null) {
                    const elStart = document.getElementById(`cell-${cell.id}`);
                    const elEnd = document.getElementById(`cell-${cell.next}`);
                    
                    if (elStart && elEnd) {
                        const rect1 = elStart.getBoundingClientRect();
                        const rect2 = elEnd.getBoundingClientRect();

                        const x1 = rect1.left - gridRect.left + rect1.width / 2;
                        const y1 = rect1.top - gridRect.top + rect1.height / 2;
                        const x2 = rect2.left - gridRect.left + rect2.width / 2;
                        const y2 = rect2.top - gridRect.top + rect2.height / 2;

                        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                        
                        const dx = x2 - x1;
                        const dy = y2 - y1;
                        const distance = Math.sqrt(dx*dx + dy*dy);
                        const curvature = distance > 50 ? 0.3 : 0.1;
                        const cx = x1 + dx/2 - dy * curvature; 
                        const cy = y1 + dy/2 + dx * curvature;

                        path.setAttribute('d', `M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`);
                        path.setAttribute('class', 'pointer-arrow');
                        
                        const strokeColor = cell.color ? cell.color.border : '#333';
                        path.setAttribute('stroke', strokeColor);
                        
                        const markerId = `arrowhead-${strokeColor.replace('#', '')}`;
                        if (!document.getElementById(markerId)) {
                            const defs = svg.querySelector('defs');
                            const marker = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
                            marker.setAttribute('id', markerId);
                            marker.setAttribute('markerWidth', '8');
                            marker.setAttribute('markerHeight', '6');
                            marker.setAttribute('refX', '7');
                            marker.setAttribute('refY', '3');
                            marker.setAttribute('orient', 'auto');
                            
                            const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                            polygon.setAttribute('points', '0 0, 8 3, 0 6');
                            polygon.setAttribute('fill', strokeColor);
                            
                            marker.appendChild(polygon);
                            defs.appendChild(marker);
                        }
                        
                        path.setAttribute('marker-end', `url(#${markerId})`);
                        svg.appendChild(path);
                    }
                }
            });
        }

        function clearSVG() {
            const svg = document.getElementById('svg-layer');
            const paths = svg.querySelectorAll('path');
            paths.forEach(p => p.remove());
        }

        function setStatus(msg, classes) {
            const el = document.getElementById('status-message');
            el.innerHTML = msg;
            el.className = `mt-4 text-center font-bold text-xs md:text-sm h-8 transition-colors px-2 flex items-center justify-center rounded border ${classes}`;
        }

        function triggerShake(el) {
            el.classList.add('shake');
            setTimeout(() => el.classList.remove('shake'), 500);
        }

        // --- Interactive Pedagogy Logic ---
        function switchCode(lang) {
            currentCodeLang = lang;
            document.getElementById('code-content').innerHTML = `<pre><code>${codeSnippets[lang]}</code></pre>`;
            
            document.getElementById('btn-py').className = lang === 'py' 
                ? 'px-3 py-1 text-xs font-bold rounded bg-blue-600 text-white transition shadow-inner' 
                : 'px-3 py-1 text-xs font-medium rounded text-slate-300 hover:text-white transition';
            
            document.getElementById('btn-cpp').className = lang === 'cpp' 
                ? 'px-3 py-1 text-xs font-bold rounded bg-emerald-600 text-white transition shadow-inner' 
                : 'px-3 py-1 text-xs font-medium rounded text-slate-300 hover:text-white transition';
        }

        function toggleAnswer() {
            const ansEl = document.getElementById('think-a');
            const btnText = document.getElementById('btn-show-ans-text');
            const iconEl = document.querySelector('#btn-show-ans i');
            const textarea = document.getElementById('think-textarea');

            if (ansEl.classList.contains('hidden')) {
                ansEl.classList.remove('hidden');
                btnText.innerHTML = dict[currentLang].btnHideAns;
                iconEl.className = 'fa-solid fa-eye-slash';
                
                // Lock textarea when answer is revealed for better pedagogical flow
                textarea.disabled = true;
                textarea.classList.add('opacity-70', 'bg-slate-50', 'cursor-not-allowed');
            } else {
                ansEl.classList.add('hidden');
                btnText.innerHTML = dict[currentLang].btnShowAns;
                iconEl.className = 'fa-solid fa-eye';
                
                // Unlock
                textarea.disabled = false;
                textarea.classList.remove('opacity-70', 'bg-slate-50', 'cursor-not-allowed');
            }
        }

        function checkQuiz(qNum, selected) {
            const fbEl = document.getElementById(`quiz-fb${qNum}`);
            fbEl.classList.remove('hidden', 'text-emerald-700', 'bg-emerald-50', 'border-emerald-200', 'text-red-700', 'bg-red-50', 'border-red-200');
            
            if (qNum === 1) {
                if (selected === 'A') {
                    fbEl.classList.add('text-emerald-700', 'bg-emerald-50', 'border', 'border-emerald-200');
                    fbEl.innerHTML = dict[currentLang].quizFbCorrect;
                } else {
                    fbEl.classList.add('text-red-700', 'bg-red-50', 'border', 'border-red-200');
                    fbEl.innerHTML = dict[currentLang].quizFbWrong;
                }
            }
        }

        // --- i18n & Updates ---
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'zh' : 'en';
            updateLanguageUI();
        }

        function updateLanguageUI() {
            const d = dict[currentLang];
            document.getElementById('app-title').innerHTML = d.appTitle;
            document.getElementById('lang-btn').innerHTML = d.langBtn;
            
            // Intro
            document.getElementById('sec-intro-title').innerHTML = d.introTitle;
            document.getElementById('sec-intro-desc').innerHTML = d.introDesc;
            
            // Concepts
            document.getElementById('lbl-array').innerHTML = d.lblArray;
            document.getElementById('desc-array').innerHTML = d.descArray;
            document.getElementById('arr-pro-title').innerHTML = d.arrProTitle;
            document.getElementById('arr-pro-desc').innerHTML = d.arrProDesc;
            document.getElementById('arr-con-title').innerHTML = d.arrConTitle;
            document.getElementById('arr-con-desc').innerHTML = d.arrConDesc;
            
            document.getElementById('lbl-ll').innerHTML = d.lblLl;
            document.getElementById('desc-ll').innerHTML = d.descLl;
            document.getElementById('ll-con-title').innerHTML = d.llConTitle;
            document.getElementById('ll-con-desc').innerHTML = d.llConDesc;
            document.getElementById('ll-pro-title').innerHTML = d.llProTitle;
            document.getElementById('ll-pro-desc').innerHTML = d.llProDesc;
            
            // Misconception / Core Concept
            document.getElementById('concept-title').innerHTML = d.conceptTitle;
            document.getElementById('concept-desc').innerHTML = d.conceptDesc;
            document.getElementById('misc-title').innerHTML = d.miscTitle;
            document.getElementById('misc-a').innerHTML = d.miscA;

            // Code
            document.getElementById('code-title').innerHTML = d.codeTitle;
            
            // Think & Link
            document.getElementById('think-title').innerHTML = d.thinkTitle;
            document.getElementById('think-q').innerHTML = d.thinkQ;
            document.getElementById('think-a-text').innerHTML = d.thinkA;
            document.getElementById('think-textarea').placeholder = d.thinkPlaceholder;
            document.getElementById('btn-show-ans-text').innerHTML = d.btnShowAns;
            document.getElementById('think-expert').innerHTML = d.thinkExpert;
            
            // Reset answer visibility on lang change
            document.getElementById('think-a').classList.add('hidden');
            document.getElementById('think-textarea').disabled = false;
            document.getElementById('think-textarea').classList.remove('opacity-70', 'bg-slate-50', 'cursor-not-allowed');
            document.querySelector('#btn-show-ans i').className = 'fa-solid fa-eye';

            // Quiz
            document.getElementById('quiz-title').innerHTML = d.quizTitle;
            document.getElementById('quiz-q1').innerHTML = d.quizQ1;
            document.getElementById('q1-optA').innerHTML = d.q1OptA;
            document.getElementById('q1-optB').innerHTML = d.q1OptB;
            document.getElementById('quiz-fb1').classList.add('hidden'); 
            
            // Controls
            document.getElementById('action-title').innerHTML = d.actionTitle;
            document.getElementById('lbl-size').innerHTML = d.lblSize;
            document.getElementById('lbl-size-hint').innerHTML = d.lblSizeHint;
            document.getElementById('btn-alloc-arr').innerHTML = d.btnAllocArr;
            document.getElementById('btn-alloc-ll').innerHTML = d.btnAllocLl;
            document.getElementById('btn-frag').innerHTML = d.btnFrag;
            document.getElementById('btn-clean').innerHTML = d.btnClean;
            document.getElementById('btn-clear-alloc').innerHTML = d.btnClearAlloc;
            
            document.getElementById('ram-title').innerHTML = d.ramTitle;
            document.getElementById('leg-free').innerHTML = d.legFree;
            document.getElementById('leg-os').innerHTML = d.legOs;
            
            setStatus("", "border-transparent");

            if (typeof MathJax !== 'undefined' && MathJax.typesetPromise) {
                MathJax.typesetPromise();
            }
        }

        window.onload = init;

    </script>
